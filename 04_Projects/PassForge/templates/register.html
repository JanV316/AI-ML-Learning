{% extends "base.html" %}

{% block title %}Register Account | PassForge{% endblock %}

{% block content %}
<div class="panel" style="max-width: 450px; margin: 2rem auto;">
  <div class="panel-header">
    <h1 class="panel-title">Create PassForge Account</h1>
  </div>

  {% if error %}
  <div class="flash-alert flash-danger">{{ error }}</div>
  {% endif %}

  <form action="{{ url_for('register') }}" method="POST">
    <div class="form-group">
      <label for="username" class="form-label">Username:</label>
      <input type="text" id="username" name="username" class="form-control" value="{{ username or '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Email Address:</label>
      <input type="email" id="email" name="email" class="form-control" value="{{ email or '' }}" required>
    </div>

    <div class="form-group">
      <label for="regPassword" class="form-label">Authentication Password:</label>
      <div style="position: relative;">
        <input type="password" id="regPassword" name="password" class="form-control" placeholder="Minimum 8 characters..." required>
        <button type="button" onclick="togglePasswordInput('regPassword', this)" style="position: absolute; right: 0.75rem; top: 0.6rem; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem;">Show</button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
  </form>

  <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-top: 1.25rem;">
    Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent-gold);">Sign In</a>
  </p>
</div>
{% endblock %}
