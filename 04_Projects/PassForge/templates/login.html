{% extends "base.html" %}

{% block title %}Sign In | PassForge{% endblock %}

{% block content %}
<div class="panel" style="max-width: 420px; margin: 2rem auto;">
  <div class="panel-header">
    <h1 class="panel-title">Sign In to Vault</h1>
  </div>

  {% if error %}
  <div class="flash-alert flash-danger">{{ error }}</div>
  {% endif %}

  <form action="{{ url_for('login') }}" method="POST">
    <div class="form-group">
      <label for="identifier" class="form-label">Username or Email:</label>
      <input type="text" id="identifier" name="identifier" class="form-control" value="{{ identifier or '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label for="loginPassword" class="form-label">Authentication Password:</label>
      <div style="position: relative;">
        <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter password..." required>
        <button type="button" onclick="togglePasswordInput('loginPassword', this)" style="position: absolute; right: 0.75rem; top: 0.6rem; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem;">Show</button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
  </form>

  <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-top: 1.25rem;">
    Need an account? <a href="{{ url_for('register') }}" style="color: var(--accent-gold);">Register Here</a>
  </p>
</div>
{% endblock %}
